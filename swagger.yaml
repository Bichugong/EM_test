openapi: 3.0.0
info:
  title: Person API
  description: API for managing persons with enriched data
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Development server
paths:
  /persons:
    get:
      tags:
        - persons
      summary: Get persons with filtering
      description: Get persons with filtering and pagination
      parameters:
        - in: query
          name: name
          schema:
            type: string
          required: false
          description: Name filter
        - in: query
          name: surname
          schema:
            type: string
          required: false
          description: Surname filter
        - in: query
          name: patronymic
          schema:
            type: string
          required: false
          description: Patronymic filter
        - in: query
          name: age_min
          schema:
            type: integer
          required: false
          description: Minimum age
        - in: query
          name: age_max
          schema:
            type: integer
          required: false
          description: Maximum age
        - in: query
          name: gender
          schema:
            type: string
          required: false
          description: Gender filter
        - in: query
          name: nationality
          schema:
            type: string
          required: false
          description: Nationality filter
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          required: false
          description: Page number
        - in: query
          name: page_size
          schema:
            type: integer
            default: 10
          required: false
          description: Page size
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Person'
        '400':
          description: Invalid input
        '500':
          description: Internal server error
    post:
      tags:
        - persons
      summary: Create a new person
      description: Create a new person with the input payload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '201':
          description: Person created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          description: Invalid input
        '500':
          description: Internal server error
  /persons/{id}:
    put:
      tags:
        - persons
      summary: Update a person
      description: Update a person by ID
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Person ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '200':
          description: Person updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          description: Invalid input
        '404':
          description: Person not found
        '500':
          description: Internal server error
    delete:
      tags:
        - persons
      summary: Delete a person
      description: Delete a person by ID
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Person ID
      responses:
        '204':
          description: Person deleted
        '400':
          description: Invalid ID
        '404':
          description: Person not found
        '500':
          description: Internal server error
components:
  schemas:
    Person:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        surname:
          type: string
        patronymic:
          type: string
        age:
          type: integer
        gender:
          type: string
        nationality:
          type: string
    PersonInput:
      type: object
      required:
        - name
        - surname
      properties:
        name:
          type: string
        surname:
          type: string
        patronymic:
          type: string